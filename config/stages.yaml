# config/stages.yaml — Single source of truth for all stage-specific parameters.
# Python dataclass constructors must NOT define competing defaults.
# core/config.py loads this file and constructs typed configs from it.

xl_init:
  run_vba_cleaning: true
  llm_model: "gpt-3.5-turbo"
  llm_max_tokens: 1024
  cell_limit: 50
  interactive: true
  skip_llm_triage: true
  approve_all_sheets: true

xl_parse:
  # Block generation
  bridging_rows: 2
  bridging_cols: 1
  connectivity: 4
  min_on_cells: 4
  do_bridging: true

  # Framing heuristics
  min_density_keep: 0.50
  min_density_reject: 0.15
  min_cells_reject: 4
  min_rows: 2
  min_cols: 2
  border_box_threshold: 0.60
  max_internal_gap_ratio: 0.30

  # Grammar — separator
  sep_max_density: 0.10
  sep_min_cross_span: 0.75

  # Grammar — header restart
  hdr_text_ratio: 0.60
  hdr_bold_ratio: 0.40
  hdr_fill_ratio: 0.30
  hdr_min_filled: 0.01
  body_numeric_ratio: 0.50
  body_min_rows_before: 3

  # Grammar — change-point
  cp_min_shift: 0.30
  cp_label_col_max: 2

  # Grammar — blank-row-only apply mode
  grammar_only_blank_row_separators: true
  grammar_separator_row_epsilon: 0.0

  # Grammar — split constraints
  grammar_split_enabled: false
  max_splits_per_block: 5
  min_sub_block_height: 2
  min_sub_block_width: 2
  min_sub_block_cells: 4

  # Pipeline
  max_framing_passes: 2
  max_workers: 4

  # Export flags
  export_training_data: false
  export_cut_candidates: true

  # QC gate
  qc_min_height: 2
  qc_min_width: 2
  qc_min_nonblank: 4
  qc_max_blank_ratio: 0.85
  qc_min_header_score: 0.3
  qc_min_structure_score: 0.4
  qc_banner_max_rows: 1
  qc_banner_text_ratio: 0.80
  qc_merge_max_gap: 1
  qc_merge_histogram_threshold: 0.3
  qc_header_pullback_max_rows: 3
  qc_footer_pullback_max_rows: 2
  qc_max_refinement_passes: 2

  # Final candidate classification
  fc_header_confidence_min: 0.4
  fc_structural_formula_ratio: 0.5
  fc_structural_input_ratio: 0.7
  fc_structural_lookup_max_cols: 3
  fc_structural_lookup_text_ratio: 0.7

  # Export flags (QC)
  export_qc_events: false

  # Merged-cell inflation, density trim, consolidation, rejected export
  merge_inflate_presence: true
  max_merge_area_for_inflation: 200
  density_trim_enabled: true
  density_trim_min_col_fill: 0.10
  density_trim_min_row_fill: 0.10
  density_trim_min_width: 2
  density_trim_min_height: 2
  consolidation_enabled: true
  consolidation_iou_threshold: 0.50
  consolidation_containment_threshold: 0.80
  consolidation_score_epsilon: 0.05
  export_rejected_blocks: true
  max_rejected_per_sheet: 200

xl_table:
  min_rows: 2
  min_cols: 2
  min_density: 0.03
  structural_blank_threshold: 0.05
  S_boundary_min: 0.05
  soft_criteria_required: 2
  max_split_depth: 8
  bimodality_threshold: 0.555
  bimodality_min_rows: 8
  min_body_rows: 2
  header_body_density_min: 0.05
  footer_max_rows: 3
  footer_density_max: 0.08
  footer_text_ratio_min: 0.70
  footer_jsd_override: 0.30
  top_k_eval: 5
  decision_w_soft: 0.60
  decision_w_bonus: 0.40
  c5_bonus_weight: 0.15
  c6_bonus_weight: 0.15
  c7_bonus_weight: 0.10
  c8_bonus_weight: 0.10
  c10_bonus_weight: 0.0
  visual:
    visual_score_min: 0.20
    n_components_max_rows: 30
    n_components_max_cols: 15
    com_chart_width_pt: 800.0
    com_chart_height_pt: 600.0
    fallback_dpi: 96
    hough_threshold: 20
    hough_min_line_fraction: 0.25
    canny_threshold1: 50
    canny_threshold2: 150
  priority_w_size: 0.35
  priority_w_bimodality: 0.25
  priority_w_separator: 0.20
  priority_w_density_var: 0.20
  candidate_w_blank_ratio: 0.50
  candidate_w_source_prior: 0.30
  candidate_w_gradient: 0.20
  overwrite_outputs: true

  # v1.2 — Gap-Separator Path
  gap_soft_required: 1
  gap_allow_zero_soft: true
  gap_blank_isolation_min: 0.95
  gap_table_likeness_min: 0.60
  gap_min_side_density: 0.03
  gap_continuity_coherence_min: 0.70
  gap_continuity_max_transition: 0.15

  # v1.2 — Scan-Separator Path
  scan_soft_required: 1
  scan_row_density_max: 0.04
  scan_blank_isolation_min: 0.90

  # v1.2 — Dual C3
  boundary_window_k: 3
  boundary_local_damping: 0.7
  boundary_local_min_rows: 2

  # v1.2 — Visual Refine Window
  visual_refine_window: 2
  visual_refine_mode: "best_qc"

  # v1.2 — Progressive Visual for Children
  max_visual_depth: 2
  min_rows_for_visual: 25
  visual_cooldown_enable: true
  visual_cooldown_hash_mode: "bbox_coords"

  # v1.2 — Block Type-Pattern Scan
  block_scan_enabled: false
  block_scan_block_rows: 10
  block_scan_min_delta: 0.25
  block_scan_top_k: 8
  block_scan_table_likeness_min: 0.55
  block_scan_header_restart_text_min: 0.50
  block_scan_continuity_break_min: 0.30

  # v1.2 — Windowed Visual Scan
  windowed_visual_enabled: true
  windowed_visual_window_rows: 10
  windowed_visual_stride_rows: 5
  windowed_visual_min_rows: 60
  windowed_visual_max_windows: 40
  windowed_visual_max_pooled_candidates: 25

  # v1.2 — Path-Aware Minimum Rows for Gap/Scan
  min_rows_gap_scan: 2

  # v1.2 — Global Visual Budget
  max_visual_calls_per_run: 100

  # v3.1 — Adaptive scan threshold
  scan_percentile: 5.0
  scan_threshold_floor: 0.01
  scan_threshold_ceiling: 0.05
  scan_min_positive_densities: 5

  # v3.1 — cut_side semantic tie-break
  cut_side_header_boost: 0.05

  # v3.1 — Grammar cut toggle + Other Tools toggle
  include_cut_candidates: true
  use_other_tools: false

xl_sheetagent:
  # Tier thresholds
  tier_a_sufficient: 0.80
  tier_b_accept: 0.80
  header_unresolved_floor: 0.60
  split_reconsideration_min: 0.70
  split_confirmation_threshold: 0.75
  section_assignment_accept: 0.65
  section_ambiguity_delta: 0.15
  table_finalization: 0.70

  # Grammar promotion (V1C)
  grammar_promotion_count: 3
  grammar_promotion_sheets: 2

  # Context / spatial
  title_shape_proximity_max: 2
  context_block_max_rows: 5
  context_block_formula_ceil: 0.05
  context_block_adjacency_max: 2

  # Sheet-level
  text_dominant_sheet_threshold: 0.70

  # Ambiguity class thresholds
  structural_threshold: 0.80
  semantic_threshold: 0.65
  presentation_threshold: 0.70

  # Debug
  debug_level: "minimal"

  # LLM (parity with xl_init). Set OPENAI_API_KEY; when skip_llm_enrichment is false, Step 4 + V1C confirms run.
  llm_model: "gpt-3.5-turbo"
  llm_max_tokens: 1024
  skip_llm_enrichment: false

  # V2 agent-based pipeline
  v2_enabled: true
  grammar_sample_max_rows: 12
  grammar_sample_count: 3
  grammar_sample_attempts: 5
  grammar_match_threshold: 0.75
  split_consideration_min_rows: 10
  split_min_score_floor: 0.3
  split_top_k: 5
  split_proximity_dedup: 2
  max_parallel_sheets: 4
  coordinator_batch_llm_threshold: 2
  ontology_hint_enabled: true

  # V3A clean redesign (table agents + sheet coordinator)
  v3a_enabled: true
  v3a_margin_trim: true
  v3a_core_numeric_ratio: 0.40
  v3a_title_scan_rows: 5
  v3a_footnote_scan_rows: 5
  v3a_skip_llm: true
  v3a_llm_model: "gpt-4o-mini"
  v3a_llm_max_tokens: 512
  v3a_max_parallel_sheets: 4
  v3a_split_threshold: 0.5

  # V3A Phase 1-3: Enhanced validation and heuristics
  v3a_header_column_validation: true      # Validate header col count matches core
  v3a_numeric_header_fallback: true       # Always try numeric header fallback
  v3a_title_single_cell_strict: true      # Enforce single-cell title rule
  v3a_footnote_all_text_strict: true      # Use all-text heuristic (not ratio)

  # V3A Phase 2: Formatting analysis
  v3a_formatting_analysis_enabled: true   # Enable bold/fill detection
  v3a_formatting_long_text_threshold: 50  # Flag row names if avg > 50 chars

  # V3A Phase 4: Two-pass split architecture
  v3a_two_pass_enabled: true              # Enable split-and-redetect
  v3a_split_core_bbox_ratio: 0.5          # Flag if core < 50% of bbox
  v3a_split_min_numeric_outside: 10       # Min numeric cells outside core
  v3a_split_max_depth: 2                  # Max recursive split depth (safety)

  # V3A Phase 4+: Hierarchical splitting (v3a.1.0)
  v3a_hierarchical_splits: true           # Enable parent-child hierarchy (FEATURE FLAG)
  v3a_multi_split_enabled: true           # Execute ALL valid splits (not just top-1)
  v3a_row_names_allow_formulas: true      # Don't reject row names with formulas
  v3a_column_split_classification: true   # Classify column splits as title/rowname

xl_sheetagent_v5:
  # Row tagging thresholds
  text_ratio_header: 0.70
  number_ratio_data: 0.50
  note_fill_max: 0.20
  title_max_nonempty: 3

  # Multi-row header detection
  header_zone_pct: 0.20
  header_col_tolerance: 1

  # Header inheritance (width vs donor header span, inclusive ±)
  inherit_header_col_tolerance: 1

  # LLM transport (used by rules engine)
  llm_model: "gpt-4o-mini"
  llm_max_tokens: 2048
  llm_temperature: 0.1
  max_retries: 5
  base_delay: 1.0

  # Core region rules
  min_component_area: 4
  component_merge_gap: 1

  # Child rules
  min_child_rows: 6
  iou_merge_threshold: 0.30

  # Formatting
  extract_formatting: false

  # Parallelism
  max_workers: 10

  # Performance guardrails
  max_llm_children_per_sheet: 20
  max_cells_per_prompt: 5000
  max_tables_per_sheet_warn: 50
  max_llm_calls_per_sheet: 30

  # Confidence weights
  w_tags: 0.30
  w_header: 0.30
  w_core: 0.20
  w_role: 0.20

  # Audit
  emit_audit: true

  # Resolution stage
  enable_resolution: true
  resolve_row_names_with_parent: true
  absorb_metadata_only_children: true

  # Core region blank inclusion
  blank_inclusion_density_threshold: 0.30

  # Enhanced LLM metadata resolution
  use_llm_metadata_resolution: true
  llm_metadata_max_tokens: 3000
  llm_metadata_max_cells: 8000
  include_cut_scores_in_prompt: true

  # Row name column detection
  row_name_text_ratio_threshold: 0.70
  use_column_cuts_for_row_names: true

  # Core-to-children consistency
  enforce_multi_core_children: true

  # Export mode (v5.1): "flat" | "hierarchical" (default: hierarchical)
  export_mode: "hierarchical"

  # LLM Rules Engine
  enable_llm_rules: true
  rule_header_number_parent_standalone: true
  rule_header_composite_all: true
  rule_header_title_collision_parent_childnum_standalone: true
  llm_rule_max_context_rows: 6

xl_sheetagent_v6:
  # Row tagging thresholds
  text_ratio_header: 0.70
  number_ratio_data: 0.50
  note_fill_max: 0.20
  title_max_nonempty: 3

  # Multi-row header detection
  header_zone_pct: 0.20
  header_col_tolerance: 1

  # Header inheritance
  inherit_header_col_tolerance: 1

  # Core region rules
  # must stay at 1 to allow single-cell cores (see Batch 3c)
  min_component_area: 1
  component_merge_gap: 1
  blank_inclusion_density_threshold: 0.30

  # Formula-dependency core expansion (Batch 3a)
  core_formula_expansion_enabled: true
  core_formula_expansion_ring: 1

  # Child rules / hierarchy / resolution (KEPT from v5)
  min_child_rows: 6
  iou_merge_threshold: 0.30
  enable_resolution: true
  absorb_metadata_only_children: true
  enforce_multi_core_children: true

  # Confidence weights (redistributed for w_llm)
  w_tags: 0.25
  w_header: 0.25
  w_core: 0.20
  w_llm: 0.15
  w_role: 0.15

  # Formatting, parallelism, audit, export
  extract_formatting: true
  max_workers: 4
  emit_audit: true
  export_mode: "hierarchical"
  row_name_text_ratio_threshold: 0.70

  # LLM transport
  llm_model: "gpt-4o-mini"
  llm_max_tokens: 2048
  llm_temperature: 0.1
  max_retries: 5
  base_delay: 1.0

  # LLM: reconciliation (resolution stage, same as v5)
  use_llm_metadata_resolution: false
  llm_metadata_max_tokens: 1500
  llm_metadata_max_cells: 1500

  # Performance guardrails
  max_cells_per_prompt: 5000
  max_tables_per_sheet_warn: 50
  max_llm_calls_per_sheet: 30
  max_llm_children_per_sheet: 10

  # Per-bbox LLM gate (Phase 2)
  enable_llm: false
  llm_gate_core_validation: true
  llm_gate_multi_core: true
  llm_gate_missing_header: true
  llm_gate_ambiguous_rows: true
  llm_gate_coverage_gap: true
  llm_gate_overlap: true
  llm_payload_max_cells: 8000
  llm_context_max_rows: 50

  # Core region validation (Phase 1)
  validate_core_top_rows: true
  core_validator_check_bottom_rows: true
  core_validator_max_strip_rows: 3
  core_validator_detect_years: true
  core_validator_detect_months: true
  core_validator_detect_cycles: true
  core_validator_detect_quarters: true
  core_validator_formula_divergence_threshold: 0.6
  core_validator_ambiguity_threshold: 0.5

  # Walks (Phase 1)
  upward_walk_max_rows: 10
  upward_walk_blank_row_stop: true
  leftward_walk_max_cols: 5
  note_scan_right_max_cols: 3
  note_scan_below_max_rows: 10

  # Beside-header title detection
  detect_beside_header_title: true
  beside_header_title_max_nonempty: 3

  # Finalize stage (deterministic, no LLM)
  enable_finalize: true
  finalize_title_max_chars: 200
  finalize_note_keywords: ["source", "note", "*", "†", "ref", "footnote"]
  finalize_flatten_depth: 1
  finalize_emit_stats: true

xl_image:
  adaptive_enabled: true
  context_pad: 2
  split_rules_path: null
  com_chart_width_pt: 800.0
  com_chart_height_pt: 600.0
  fallback_dpi: 96
  fallback_cell_width_in: 1.0
  fallback_cell_height_in: 0.25
  max_cell_text_chars: 18
  fallback_font_size: 6.5
  canny_threshold1: 50
  canny_threshold2: 150
  hough_threshold: 20
  hough_min_line_fraction: 0.25
  hough_max_line_gap: 8
  saturation_high_threshold: 100
  cc_brightness_threshold: 0.90
  cc_min_area_fraction: 0.005
  cc_noise_area_px: 50
  border_margin_fraction: 0.03
  border_profile_margin_fraction: 0.02
  symmetry_window: 3
  symmetry_deviation_floor: 0.05
  split_blank_floor: 0.85
  split_blank_soft_floor: 0.95
  split_bright_soft_floor: 0.92
  split_density_soft_ceiling: 0.03
  split_line_floor: 0.30
  split_brightness_high: 0.88
  split_brightness_delta_floor: 0.10
  split_line_delta_floor: 0.10
  split_saturation_floor: 0.10
  split_component_density_floor: 0.10
  split_line_coverage_floor: 0.50
  split_symmetry_break_floor: 0.55
  split_delta_border_floor: 0.15
  split_near_edge_score_gate: 0.85
  split_min_score_gate: 0.12
  split_top_k: 5
  split_min_gap: 1
  cc_valley_depth_floor: 0.05
  cc_valley_height_min_px: 3
  cc_separation_score_floor: 0.30
