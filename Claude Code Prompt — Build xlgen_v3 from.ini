Claude Code Prompt — Build xlgen_v3 from xlgen_v2
WHO YOU ARE AND WHAT THIS IS

You are working on a local Python backend called xlgen_v2.

xlgen_v2 is a spreadsheet-native structural backend for Microsoft Excel models. It is not a web app, not a chatbot, and not a generic RAG system. It is a deterministic Excel backend that cleans workbooks, extracts structural candidates, assembles structural tables, and preserves artifacts for downstream reasoning.

Your job is to create a new project called xlgen_v3 alongside xlgen_v2.

xlgen_v3 is the Excel-only backend for CHERI.

It must be built as a clean monorepo refactor of xlgen_v2, while preserving the real logic that already exists and standardizing the stage structure, output contracts, and run-time paths.

WHAT xlgen_v3 IS

xlgen_v3 is a four-stage Excel backend:

xl_init   →   xl_parse   →   xl_table   →   [xl_image optional]

Where:

xl_init = workbook ingest, VBA cleaning, sheet approval, metadata extraction, floating-content preservation
xl_parse = deterministic bbox detection, framing, grammar cuts, QC, reject export, coverage export
xl_table = renamed xl_kg; structural table detection and assembly
xl_image = optional visual rendering + image-derived feature extraction
THE SINGLE MOST IMPORTANT FACT

xl_kg in xlgen_v2 is NOT a true knowledge graph module.

It is a structural table detection and assembly module.

It:

receives parse-stage candidate artifacts from xl_parse
runs heuristic table detection on top of those candidates
uses dependency-group-style grouping logic to assemble structural table objects
produces final structural table outputs

In xlgen_v3, xl_kg must be renamed to xl_table.

This rename is non-negotiable.

Do NOT create fake or placeholder “true KG” modules such as:

dep_graph.py
formula_tracer.py
model_tree.py
symbol_table.py

Those are future work and are not part of this migration.

