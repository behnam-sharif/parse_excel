OUTPUT ROOT POLICY

There must be one output root per run:

data/output/<run_id>/

Within that run root, create:

init_output/
parse_output/
table_output/
image_output/
logs/

Do not scatter outputs into stage-local runs/, outputs/, or local data/ folders.

IMPLEMENT core.paths AS SINGLE SOURCE OF TRUTH

Create core/paths.py and route all stage outputs through it.

At minimum include functions like:

from pathlib import Path

def get_run_root(run_id: str, base: str = "data/output") -> Path:
    return Path(base) / run_id

def get_init_output_path(run_id: str) -> Path:
    return get_run_root(run_id) / "init_output"

def get_parse_output_path(run_id: str) -> Path:
    return get_run_root(run_id) / "parse_output"

def get_table_output_path(run_id: str) -> Path:
    return get_run_root(run_id) / "table_output"

def get_image_output_path(run_id: str) -> Path:
    return get_run_root(run_id) / "image_output"

def get_log_path(run_id: str) -> Path:
    return get_run_root(run_id) / "logs"

No stage module may define its own output root.

If legacy code is too entangled, wrap it with adapters first, then refactor inward.

