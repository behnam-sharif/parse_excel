# BIM Domain Ontology
#
# Defines concepts, keywords, and relationships for Budget Impact Model workbooks.

version: "1.0"
domain: "Budget Impact Modeling (BIM)"

concepts:
  - id: "cost_analysis"
    name: "Cost Analysis"
    description: "Analysis of costs including drugs, hospitalization, and treatments"
    keywords:
      - "cost"
      - "costs"
      - "price"
      - "expense"
      - "expenditure"
      - "spending"
      - "$"
      - "dollar"
    examples:
      - "Drug costs over time"
      - "Total treatment costs"
      - "Cost per patient"

  - id: "drug_comparison"
    name: "Drug Comparison"
    description: "Comparison of different drug treatments and regimens"
    keywords:
      - "drug"
      - "treatment"
      - "therapy"
      - "medication"
      - "regimen"
      - "compound"
      - "agent"
    examples:
      - "Inotuzumab vs FLAG-Ida"
      - "Treatment options"
      - "Drug efficacy comparison"

  - id: "market_share"
    name: "Market Share"
    description: "Market share projections and adoption rates for products"
    keywords:
      - "market share"
      - "market shares"
      - "adoption"
      - "utilization"
      - "penetration"
      - "uptake"
      - "share"
    examples:
      - "Current vs Future market share"
      - "Product adoption over time"
      - "Market penetration rates"

  - id: "patient_population"
    name: "Patient Population"
    description: "Patient counts, eligibility criteria, and population estimates"
    keywords:
      - "patients"
      - "population"
      - "eligible"
      - "enrolled"
      - "treated"
      - "incidence"
      - "prevalence"
    examples:
      - "Eligible patient population"
      - "Patients per year"
      - "Population size estimates"

  - id: "adverse_events"
    name: "Adverse Events"
    description: "Costs and rates of adverse events and side effects"
    keywords:
      - "adverse events"
      - "adverse event"
      - "side effects"
      - "safety"
      - "toxicity"
      - "AE"
      - "SAE"
      - "complications"
    examples:
      - "AE costs by treatment"
      - "Safety profile comparison"
      - "Adverse event rates"

  - id: "hospitalization"
    name: "Hospitalization"
    description: "Hospitalization costs, durations, and inpatient care"
    keywords:
      - "hospitalization"
      - "hospital"
      - "inpatient"
      - "admission"
      - "discharge"
      - "length of stay"
      - "LOS"
    examples:
      - "Hospitalization costs"
      - "Average hospital stay"
      - "Inpatient treatment costs"

  - id: "subsequent_treatment"
    name: "Subsequent Treatment"
    description: "Costs and patterns of subsequent treatments after initial therapy"
    keywords:
      - "subsequent"
      - "second-line"
      - "second line"
      - "relapse"
      - "salvage"
      - "next treatment"
      - "follow-up"
    examples:
      - "Second-line therapy costs"
      - "Subsequent treatment patterns"
      - "Relapse treatment costs"

  - id: "stem_cell_transplant"
    name: "Stem Cell Transplant"
    description: "Stem cell transplantation procedures and associated costs"
    keywords:
      - "stem cell"
      - "transplant"
      - "HSCT"
      - "allogeneic"
      - "autologous"
      - "BMT"
      - "bone marrow"
    examples:
      - "HSCT costs"
      - "Transplant eligibility"
      - "Allogeneic transplant rates"

  - id: "end_of_life"
    name: "End-of-Life Care"
    description: "End-of-life care costs and palliative treatments"
    keywords:
      - "end-of-life"
      - "end of life"
      - "palliative"
      - "terminal"
      - "EOL"
      - "hospice"
    examples:
      - "EOL care costs"
      - "Palliative care expenses"
      - "Terminal phase costs"

  - id: "scenario_comparison"
    name: "Scenario Comparison"
    description: "Comparing different intervention scenarios (e.g., with/without drug)"
    keywords:
      - "world with"
      - "world without"
      - "scenario"
      - "comparison"
      - "vs"
      - "versus"
      - "with InO"
      - "without InO"
    examples:
      - "World with InO vs World without InO"
      - "Scenario A vs Scenario B"
      - "Intervention comparison"

  - id: "time_series"
    name: "Time Series"
    description: "Time-based projections and multi-year forecasts"
    keywords:
      - "year"
      - "2020"
      - "2021"
      - "2022"
      - "2023"
      - "2024"
      - "annual"
      - "projection"
      - "forecast"
      - "time"
    examples:
      - "Annual costs 2020-2024"
      - "Multi-year projections"
      - "Yearly patient counts"

  - id: "calculation_summary"
    name: "Calculation Summary"
    description: "Summary and calculation rows (totals, subtotals)"
    keywords:
      - "total"
      - "subtotal"
      - "sum"
      - "grand total"
      - "aggregate"
      - "combined"
    examples:
      - "Total costs"
      - "Subtotal by category"
      - "Grand total"

relationships:
  - from: "cost_analysis"
    to: "drug_comparison"
    type: "analyzes"
    description: "Cost analysis often compares costs across drugs"

  - from: "drug_comparison"
    to: "scenario_comparison"
    type: "part_of"
    description: "Drug comparisons are often part of scenario analysis"

  - from: "adverse_events"
    to: "cost_analysis"
    type: "contributes_to"
    description: "Adverse events contribute to overall treatment costs"

  - from: "hospitalization"
    to: "cost_analysis"
    type: "contributes_to"
    description: "Hospitalization is a major cost component"

  - from: "subsequent_treatment"
    to: "cost_analysis"
    type: "contributes_to"
    description: "Subsequent treatments add to total cost burden"

  - from: "stem_cell_transplant"
    to: "cost_analysis"
    type: "contributes_to"
    description: "Transplants are high-cost interventions"

  - from: "end_of_life"
    to: "cost_analysis"
    type: "contributes_to"
    description: "End-of-life care contributes to total costs"

  - from: "patient_population"
    to: "market_share"
    type: "influences"
    description: "Population size influences market share calculations"

  - from: "time_series"
    to: "cost_analysis"
    type: "temporal_dimension"
    description: "Time series provides temporal context for cost analysis"

  - from: "calculation_summary"
    to: "cost_analysis"
    type: "aggregates"
    description: "Summaries aggregate cost components"

metadata:
  author: "Claude Code"
  created: "2026-04-10"
  version: "1.0"
  purpose: "BIM table classification and semantic understanding"
